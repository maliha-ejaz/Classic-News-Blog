<!doctype html>
<html lang="en">
    <head>
        <title>News Blog - Pakistan</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <link href="style.css" rel="stylesheet">
    </head>

    <body>
        <header>
            <div id="menuBtn">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <h1 class="text-center">News Blog</h1>  
        </header>
        <div id="mySidePanel" class="sidePanel">
                <a href="/index.html">Home</a>
                <a class="active" href= "/pakistan.html" >Pakistan</a>
                <a href="/sports.html">Sports</a>
            </div>
        <main class="py-3">
            
            <div class="container">
                <h2>The Digital Newspaper</h2>
                <div class="loader" id="loaderWrapper"></div>
                <div class="row" id="newsContainer"></div>
            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
        <script>
            let newsLoader = document.getElementById("loaderWrapper");
            async function fetchData() {
                newsLoader.style.display = "block";
                let response = await fetch("http://androidstudent.com/apis/thenews/pakistani.php");
                let newsArray = await response.json();
                newsLoader.style.display = "none";

                let fullNewsHtml = '';
                for(let newsItem of newsArray) {
                    let newsHtml = `<div class="col-sm-6 col-md-4 col-lg-3 pb-lg-3">
                        <a href='${newsItem.link}' target='_blank'>
                            <img class="img-fluid" src="${newsItem.image}">
                        </a>
                        <p class="mb-0">${newsItem.publishDate}</p>
                        <h3 class="fs-6"><a href='${newsItem.link} target='_blank'' class="text-decoration-none text-black ">${newsItem.title}</h3>
                    </div>`;
                    fullNewsHtml += newsHtml;
                }
                let newsContainer = document.getElementById("newsContainer");
                newsContainer.innerHTML = fullNewsHtml;
            }
            fetchData();

            let menuBtn = document.getElementById("menuBtn");
            menuBtn.addEventListener('click', ()=>{
                let mySidePanel = document.getElementById("mySidePanel");
                mySidePanel.style.width = "200px";
            });
            menuBtn.addEventListener('dblclick', ()=>{
                let mySidePanel = document.getElementById("mySidePanel");
                mySidePanel.style.width = "0px";
            });
            
        </script>

    </body>
</html>
